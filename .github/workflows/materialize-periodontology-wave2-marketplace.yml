name: Materialize Wave 2 Periodontology marketplace

on:
  push:
    branches:
      - feature/periodontology-research-profile-v1
    paths:
      - .github/workflows/materialize-periodontology-wave2-marketplace.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/periodontology-research-profile-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository marketplace generator
        run: python3 scripts/gen_marketplace_json.py

      - name: Enforce bounded generated diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            if [[ "$path" != ".claude-plugin/marketplace.json" ]]; then
              echo "Unexpected marketplace drift: $path" >&2
              exit 1
            fi
          done

      - name: Commit marketplace output when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .claude-plugin/marketplace.json; then
            echo "Marketplace already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git commit -m "chore(generated): refresh periodontology marketplace"
          git push origin HEAD:feature/periodontology-research-profile-v1
