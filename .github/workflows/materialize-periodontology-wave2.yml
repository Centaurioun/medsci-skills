name: Materialize Wave 2 Periodontology generated surfaces

on:
  push:
    branches:
      - feature/periodontology-research-profile-v1
    paths:
      - .github/workflows/materialize-periodontology-wave2.yml
      - scripts/gen_skills_catalog_json.py
      - skills/periodontology-research/**

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/periodontology-research-profile-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository generators
        run: |
          python3 scripts/gen_skill_docs.py
          python3 scripts/gen_skills_catalog_json.py

      - name: Enforce bounded generated diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          allowed=(
            "docs/skills/README.md"
            "docs/skills/periodontology-research.md"
            "metadata/skills_catalog.json"
          )
          for path in "${changed[@]}"; do
            ok=0
            for candidate in "${allowed[@]}"; do
              if [[ "$path" == "$candidate" ]]; then
                ok=1
                break
              fi
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Unexpected generated drift: $path" >&2
              exit 1
            fi
          done

      - name: Commit generated outputs when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/skills/README.md docs/skills/periodontology-research.md metadata/skills_catalog.json; then
            echo "Generated surfaces already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/skills/README.md docs/skills/periodontology-research.md metadata/skills_catalog.json
          git commit -m "chore(generated): materialize periodontology catalog and docs"
          git push origin HEAD:feature/periodontology-research-profile-v1
