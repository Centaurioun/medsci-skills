name: Materialize Wave 2 Periodontology distribution metadata

on:
  push:
    branches:
      - feature/periodontology-research-profile-v1
    paths:
      - .github/workflows/materialize-periodontology-wave2-distribution.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/periodontology-research-profile-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository distribution generator
        run: python3 scripts/gen_distribution_manifest.py

      - name: Enforce bounded generated diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          allowed=(
            "metadata/distribution_manifest.json"
            "metadata/distribution_files.json"
          )
          for path in "${changed[@]}"; do
            ok=0
            for candidate in "${allowed[@]}"; do
              if [[ "$path" == "$candidate" ]]; then
                ok=1
                break
              fi
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Unexpected distribution drift: $path" >&2
              exit 1
            fi
          done

      - name: Commit generated metadata when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- metadata/distribution_manifest.json metadata/distribution_files.json; then
            echo "Distribution metadata already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/distribution_manifest.json metadata/distribution_files.json
          git commit -m "chore(generated): refresh periodontology distribution metadata"
          git push origin HEAD:feature/periodontology-research-profile-v1
