name: Materialize Wave 2 Periodontology catalog counts

on:
  push:
    branches:
      - feature/periodontology-research-profile-v1
    paths:
      - .github/workflows/materialize-periodontology-wave2-counts.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/periodontology-research-profile-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh skill-count SSOT and public count surfaces
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence of {old!r}, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          counts_path = Path("metadata/catalog_counts.json")
          counts = json.loads(counts_path.read_text(encoding="utf-8"))
          if counts.get("skills") != 58:
              raise SystemExit(f"catalog_counts.json: expected skills=58 before Wave 2 bump, found {counts.get('skills')!r}")
          counts["skills"] = 59
          counts_path.write_text(json.dumps(counts, indent=2, ensure_ascii=True) + "\n", encoding="utf-8")

          replace_once("README.md", "**58 skills that actually work.**", "**59 skills that actually work.**")
          replace_once("README.md", "img.shields.io/badge/Skills-58-", "img.shields.io/badge/Skills-59-")
          replace_once("README.md", "All 58 skills, grouped by where they fit", "All 59 skills, grouped by where they fit")
          replace_once(
              "README.md",
              "| 📐 **Design & plan** | `design-study` · `calc-sample-size` · `define-variables` · `write-protocol` · `fill-protocol` · `design-ai-benchmarking` |",
              "| 📐 **Design & plan** | `design-study` · `periodontology-research` · `calc-sample-size` · `define-variables` · `write-protocol` · `fill-protocol` · `design-ai-benchmarking` |",
          )

          replace_once("README.zh-CN.md", "**58 项实际有效的技能。**", "**59 项实际有效的技能。**")
          replace_once("README.zh-CN.md", "img.shields.io/badge/Skills-58-", "img.shields.io/badge/Skills-59-")

          replace_once("paper.md", "58 task-bounded skills", "59 task-bounded skills")
          PY

      - name: Enforce bounded diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          allowed=(
            "README.md"
            "README.zh-CN.md"
            "metadata/catalog_counts.json"
            "paper.md"
          )
          for path in "${changed[@]}"; do
            ok=0
            for candidate in "${allowed[@]}"; do
              if [[ "$path" == "$candidate" ]]; then
                ok=1
                break
              fi
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Unexpected count-surface drift: $path" >&2
              exit 1
            fi
          done

      - name: Commit count updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md metadata/catalog_counts.json paper.md
          git commit -m "chore(catalog): refresh skill count for periodontology"
          git push origin HEAD:feature/periodontology-research-profile-v1
